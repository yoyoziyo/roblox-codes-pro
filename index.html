<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="google-adsense-account" content="ca-pub-4069856205850989">
  <meta name="theme-color" content="#111216">
  <title>Choose your language — 67Codes</title>
  <link rel="icon" href="/assets/ui/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center}.language-entry{width:min(520px,calc(100% - 32px));padding:42px;border:1px solid var(--line);border-radius:20px;background:var(--surface);text-align:center;box-shadow:var(--shadow)}.language-entry .brand{justify-content:center}.language-entry h1{margin:26px 0 8px;font-size:30px}.language-entry p{margin:0;color:var(--muted)}.language-entry nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.language-entry .button{border-color:var(--line);background:var(--surface-2)}@media(max-width:480px){.language-entry{padding:30px 20px}.language-entry nav{grid-template-columns:1fr}}
  </style>
  <script>
    (function(){
      try{
        const saved=localStorage.getItem("yocodes-language");
        const languages=navigator.languages?.length?navigator.languages:[navigator.language||"en"];
        const locale=saved==="pt-BR"||(!saved&&languages.some(value=>String(value).toLowerCase().startsWith("pt")))?"pt-br":"en";
        location.replace(`/${locale}${location.search}${location.hash}`);
      }catch{}
    })();
  </script>
</head>
<body>
  <main class="language-entry">
    <a class="brand" href="/en" aria-label="67Codes home"><img class="brand-logo" src="/assets/ui/logo.webp" alt="" onload="this.classList.add('loaded')"><span class="brand-fallback" aria-hidden="true"><span class="brand-mark">67</span><span class="brand-name">67<span>Codes</span></span></span></a>
    <h1>Choose your language</h1>
    <p>Escolha seu idioma</p>
    <nav aria-label="Language selection">
      <a class="button" href="/en" data-language="en">English</a>
      <a class="button" href="/pt-br" data-language="pt-BR">Português</a>
    </nav>
  </main>
  <script>document.querySelectorAll("[data-language]").forEach(link=>link.addEventListener("click",()=>localStorage.setItem("yocodes-language",link.dataset.language)))</script>
</body>
</html>
