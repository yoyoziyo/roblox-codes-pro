name: Update Roblox ranking

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-roblox-ranking
  cancel-in-progress: false

jobs:
  update-ranking:
    name: Call protected ranking endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOCODES_CRON_URL: ${{ secrets.YOCODES_CRON_URL }}
      YOCODES_CRON_SECRET: ${{ secrets.YOCODES_CRON_SECRET }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${YOCODES_CRON_URL}" ]]; then
            echo "::error::Missing GitHub Actions secret: YOCODES_CRON_URL"
            exit 1
          fi
          if [[ -z "${YOCODES_CRON_SECRET}" ]]; then
            echo "::error::Missing GitHub Actions secret: YOCODES_CRON_SECRET"
            exit 1
          fi
          if [[ "${YOCODES_CRON_URL}" != https://* ]]; then
            echo "::error::YOCODES_CRON_URL must use HTTPS"
            exit 1
          fi

      - name: Update Roblox ranking
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          if ! curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 45 \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            --user-agent "YoCodes-GitHub-Cron/1.0" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${YOCODES_CRON_SECRET}" \
            --output "${response_file}" \
            "${YOCODES_CRON_URL}"
          then
            echo "::error::The YoCodes ranking endpoint returned an error or timed out"
            exit 1
          fi

          echo "YoCodes ranking updated successfully."